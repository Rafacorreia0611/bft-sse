plugins {
    id 'java'
    id 'distribution'
    id 'org.hidetake.ssh' version '2.10.1'
}

group 'cobra'
version '1.0'

repositories {
    mavenCentral()
}

compileJava {
    sourceCompatibility = 8
    targetCompatibility = 8
}

distributions {
    main {
        contents {
            into('pairing') {
                from 'pairing'
            }
            from 'pairing_based_execution.sh'
            into('config') {
                from('config') {
                    include '**/*'
                }
            }
            into('oram_config') {
                from('oram_config') {
                    include '**/*'
                }
            }
            into('lib') {
                from jar
                from(configurations.runtimeClasspath)
            }
            from 'scripts'
        }
    }
}

remotes {
    master {
		//Create a gradle.properties and set the following properties: remoteDeployMasterHost, remoteDeployMasterUser,
		// remoteDeployMasterPrivateKeyFile
		if (project.hasProperty("remoteDeployMasterHost")) {
			host = remoteDeployMasterHost
		}
		if (project.hasProperty("remoteDeployMasterUser")) {
			user = remoteDeployMasterUser
		}
		if (project.hasProperty("remoteDeployMasterPrivateKeyFile")) {
			identity = file(remoteDeployMasterPrivateKeyFile)
		}
    }
}

ssh.settings {
    fileTransfer = 'scp'
}

task localDeploy(dependsOn: installDist) {
    doLast {
        def parsePositiveCount = { propertyName, defaultValue ->
            def propertyValue = project.findProperty(propertyName)
            if (propertyValue == null) {
                return defaultValue
            }

            try {
                int parsedValue = Integer.parseInt(propertyValue.toString())
                if (parsedValue < 1) {
                    throw new GradleException("Property '${propertyName}' must be greater than 0.")
                }
                return parsedValue
            } catch (NumberFormatException e) {
                throw new GradleException("Property '${propertyName}' must be a valid integer.", e)
            }
        }

        int nServers = parsePositiveCount('servers', 4)
        int nOramServers = parsePositiveCount('oramServers', nServers)
        int nClients = parsePositiveCount('clients', 1)

		def fileSeparator = System.getProperty("file.separator")
		def src = project.buildDir.name + fileSeparator + "install" + fileSeparator + project.name
		def workingDirectory = project.buildDir.name + fileSeparator + "local" + fileSeparator

        println ("Deploying project into ${workingDirectory}")
        println ("SSE servers: ${nServers}, ORAM servers: ${nOramServers}, clients: ${nClients}")

        for (i in 0..<nServers) {
            def target = workingDirectory + "rep${i}"
            copy {
                from src
                into target
            }
        }

        for (i in 0..<nOramServers) {
            def target = workingDirectory + "oramRep${i}"
            copy {
                from src
                into target
            }
            copy {
                from src + fileSeparator + 'oram_config'
                into target + fileSeparator + 'config'
            }
        }

        for (i in 0..<nClients) {
            def target = workingDirectory + "cli${i}"
            copy {
                from src
                into target
            }
            copy {
                from src + fileSeparator + 'config'
                into target + fileSeparator + 'sse_config'
            }
            copy {
                from src + fileSeparator + 'oram_config'
                into target + fileSeparator + 'config'
            }
            delete target + fileSeparator + 'oram_config'
            copy {
                from 'datasets/vocabulary'
                into target + fileSeparator + 'datasets' + fileSeparator + 'vocabulary'
            }
        }
    }
}

task remoteDeploy(dependsOn: installDist) {
    doLast {
        def fileSeparator = System.getProperty("file.separator")
        def src = project.buildDir.name + fileSeparator + "install" + fileSeparator + project.name
        def target = '~/'
        ssh.run {
            session(remotes.master) {
                put from: src, into: target
            }
        }
    }
}

task processEnronDataset(type: JavaExec, dependsOn: classes) {
    group = 'dataset'
    description = 'Processes the Enron CSV into keyword-to-docId NDJSON output.'
    classpath = sourceSets.main.runtimeClasspath
    main = 'sse.dataset.enron.EnronCsvProcessor'

    def inputPath = (project.findProperty('input') ?: 'datasets/raw/enron/emails.csv').toString()
    def outputPath = (project.findProperty('output') ?: 'datasets/processed/enron/keyword_to_docids.ndjson').toString()
    def mode = (project.findProperty('mode') ?: 'compact').toString()
    def topK = (project.findProperty('topK') ?: '500').toString()
    def maxDocFreqRatio = (project.findProperty('maxDocFreqRatio') ?: '0.02').toString()
    def bucketSpec = (project.findProperty('bucketSpec') ?: '8:12,80:120,800:1200,8000:12000').toString()
    def samplesPerBucket = (project.findProperty('samplesPerBucket') ?: '10').toString()

    args inputPath, outputPath, mode, topK, maxDocFreqRatio, bucketSpec, samplesPerBucket
}

task exportUsableVocabulary(type: JavaExec, dependsOn: classes) {
    group = 'dataset'
    description = 'Exports one usable raw vocabulary keyword per protocol-normalized keyword.'
    classpath = sourceSets.main.runtimeClasspath
    main = 'sse.vocabulary.VocabularyExporter'

    def inputPath = (project.findProperty('vocabularyInput') ?: 'datasets/vocabulary/vocabulary.txt').toString()
    def outputPath = (project.findProperty('vocabularyOutput') ?: "${buildDir}/tmp/usable-vocabulary.txt").toString()

    args inputPath, outputPath
}

