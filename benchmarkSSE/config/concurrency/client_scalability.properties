########## DATASET ##########

# Vocabulary used by dataset generation, PopulateDB, and BenchmarkClient.
# Relative paths are resolved from this config file's folder.
vocabularyPath=../../../datasets/vocabulary/vocabulary.txt

# Every generated keyword begins with the same number of document identifiers.
syntheticKeywordCount=5000
syntheticDocumentsPerKeyword=100

# Fixed dataset seed and starting workload seed for repetition 1.
seed=random

########## EXPERIMENT MATRIX ##########

# Concurrent logical clients created inside one BenchmarkClient JVM.
clientCounts=1,5,10,15,20,25,30,35,40

# Client scalability compares search-only and update-only workloads.
searchPercentages=100,0

# Uniform runs once. Zipfian runs once for every configured exponent.
accessDistributions=uniform,zipfian
zipfianExponents=1.0,2.0

repetitions=3

########## REPLICATION ##########

sseReplicas=4

# Use -1 to match sseReplicas.
oramReplicas=-1

########## CLIENTS AND POPULATION ##########

populateClientId=1

# Logical clients used concurrently inside one PopulateDB JVM.
populateClientCount=16
populateBatchSize=300

# First benchmark client ID. Later clients use consecutive identifiers.
clientId=100

########## EXECUTION ##########

warmupSeconds=30
measurementSeconds=360
warmupKeywordCount=100
