########## DATASET SELECTION ##########

# Dataset used by this benchmark: enron or synthetic.
datasetType=synthetic

# Vocabulary used to initialize the keyword address map and ORAM.
# Relative paths are resolved from this config file's folder.
vocabularyPath=../../../datasets/vocabulary/vocabulary.txt

########## ENRON DATASET ##########

# Processing mode used by EnronCsvProcessor.
processorMode=benchmark

# NDJSON file generated for this benchmark dataset.
# Relative paths are resolved from this config file's folder.
processorOutputPath=../../datasets/search/latency_by_docs/benchmark_keyword_to_docids.ndjson

# Document-frequency buckets used when sampling keywords from the real dataset.
processorBuckets=8:12,80:120,800:1200,8000:12000

# Number of keywords selected per bucket when generating the Enron benchmark dataset.
# For this benchmark it should match warmupPerBucket + measurementsPerBucket.
processorSamplesPerBucket=3

########## SYNTHETIC DATASET ##########

# NDJSON file generated for the synthetic benchmark dataset.
# Relative paths are resolved from this config file's folder.
syntheticOutputPath=../../datasets/search/latency_by_docs/synthetic_keyword_to_docids.ndjson

# Number of keywords generated for each configured document count.
# For this benchmark it should match warmupPerBucket + measurementsPerBucket.
syntheticKeywordsPerDocCount=40

# Exact number of document identifiers associated with each synthetic keyword group.
syntheticDocCounts=10,100,1000,10000

# Integer seed for reproducible synthetic datasets, or random for a fresh seed.
seed=42

########## DEPLOYMENT ##########

# Number of SSE replicas to start locally.
sseReplicas=4

# Number of ORAM replicas. Use -1 to match sseReplicas (including --sseReplicas overrides).
oramReplicas=-1

# Maximum concurrent ORAM clients accepted by each ORAM server.
oramMaxConcurrentClients=1

# Number of client folders to create in localDeploy.
deployClientCount=2

# Client directory used to run PopulateDB.
populateClientDir=cli0

# Client identifier used by PopulateDB.
populateClientId=101

# Number of document identifiers grouped into each PopulateDB bulk request.
populateBatchSize=300

# Client directory used to run the benchmark client.
benchmarkClientDir=cli1

# Client identifier used by the benchmark client process.
clientId=100

########## BENCHMARK EXECUTION ##########

# Benchmark scenario name handled by BenchmarkClient.
scenario=search-latency-by-docs

# Number of warmup searches per bucket.
warmupPerBucket=10

# Number of measured keywords per bucket.
measurementsPerBucket=30

########## OUTPUTS ##########

# When true, generated CSV/TSV/PNG artifacts receive a timestamp suffix.
timestampOutputs=true

# NDJSON input consumed by the benchmark.
inputPath=../../datasets/search/latency_by_docs/synthetic_keyword_to_docids.ndjson

# CSV file written by the benchmark run.
outputPath=../../results/data/search_latency_by_docs.csv

# TSV summary generated from the raw CSV after the benchmark finishes.
summaryOutputPath=../../results/data/search_latency_by_docs_summary.tsv

# PNG plot generated for the mean latency series.
meanPlotOutputPath=../../plots/search_latency_mean.png

# PNG plot generated for the median latency series.
medianPlotOutputPath=../../plots/search_latency_median.png
