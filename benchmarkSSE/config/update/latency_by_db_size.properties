########## DATABASE GENERATION ##########

# Vocabulary used to select update and filler keywords.
# Relative paths are resolved from this config file's directory.
vocabularyPath=../../../datasets/vocabulary/vocabulary.txt

# Directory where the generator writes workload and population NDJSON files.
datasetOutputDir=../../datasets/update/latency_by_db_size

# Integer seed for reproducible generation, or random for a fresh seed.
seed=random

# Target database association counts reached at the middle measured update.
dbSizes=100000,250000,500000,750000,1000000

# Fixed number of document associations added by every update.
updateDocCount=1000

# Normal number of associations assigned to each population filler keyword.
fillerDocsPerKeyword=1000

########## DEPLOYMENT ##########

# Number of SSE replicas used when no CLI override is supplied.
sseReplicas=4

# Number of ORAM replicas. Use -1 to follow the effective SSE replica count.
oramReplicas=-1

# Maximum simultaneous clients accepted by each ORAM replica.
oramMaxConcurrentClients=1

# Number of cliN deployment directories.
deployClientCount=2

# Client used to populate each generated database.
populateClientDir=cli0
populateClientId=101
populateBatchSize=300

# Client used to execute the benchmark updates.
benchmarkClientDir=cli1
clientId=100

########## BENCHMARK EXECUTION ##########

# Existing Java scenario reused by this benchmark.
scenario=update-latency-by-docs

# Generated updates executed before latency measurements begin.
warmupCount=2

# Number of measured updates. Must be positive and odd.
measurementCount=5

########## OUTPUTS ##########

# When true, generated result groups receive timestamped names.
timestampOutputs=true

# Base output paths. The runner will place per-database artifacts in its run group.
outputPath=../../results/data/update_latency_by_db_size.csv
summaryOutputPath=../../results/data/update_latency_by_db_size_summary.tsv
