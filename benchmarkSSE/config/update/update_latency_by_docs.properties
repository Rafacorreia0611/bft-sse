########## BASE DB DATASET ##########

# Vocabulary used by dataset generation, PopulateDB, and BenchmarkClient.
# Relative paths are resolved from this config file's folder.
vocabularyPath=../../../datasets/vocabulary/vocabulary.txt

# Integer seed used by all dataset/workload generation, or random for a fresh seed.
seed=random

# NDJSON file generated for the synthetic base database.
baseDatasetOutputPath=../../datasets/update/base_db_keyword_to_docids.ndjson

# T: database association count at the middle measurement.
dbSize=500000

# Document counts used to construct a base dataset with exactly the required size.
baseSyntheticDocCounts=1000

########## UPDATE WORKLOAD ##########

# NDJSON file containing one single-keyword update per line.
workloadOutputPath=../../datasets/update/update_latency_by_docs.ndjson

# D values tested in separate fresh deployments.
measurementDocCounts=1000,5000,10000,15000

# Unmeasured updates performed before the measured updates.
warmupCount=2

# Number of measured updates. Must be positive and odd so one update runs at dbSize.
measurementCount=5

########## DEPLOYMENT ##########

# Number of SSE replicas to start.
sseReplicas=4

# Number of ORAM replicas. Use -1 to follow the final SSE replica count.
oramReplicas=-1

# Maximum simultaneous clients accepted by each ORAM replica.
oramMaxConcurrentClients=1

# Number of client folders created by localDeploy.
deployClientCount=2

# Client used to populate the base database.
populateClientDir=cli0
populateClientId=101
populateBatchSize=5000

# Client used to execute the benchmark.
benchmarkClientDir=cli1
clientId=100

########## BENCHMARK EXECUTION ##########

scenario=update-latency-by-docs

########## OUTPUTS ##########

timestampOutputs=true

# BenchmarkClient input. It must match workloadOutputPath.
inputPath=../../datasets/update/update_latency_by_docs.ndjson

# Raw per-measurement CSV and aggregated TSV base paths.
outputPath=../../results/data/update_latency_by_docs.csv
summaryOutputPath=../../results/data/update_latency_by_docs_summary.tsv
